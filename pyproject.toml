# Project metadata and tool settings, kept in one file.
# Why: pip, pytest, and ruff all read this file, so there is no separate config per tool.
# Used by: `pip install -e ".[dev]"`, `pytest`, `ruff`, and .github/workflows/ci.yml.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ops"
version = "0.1.0"
description = "Educational AI operations assistant: LLM integration, RAG, agents, and workflow automation."
readme = "README.md"
requires-python = ">=3.12"
# httpx2 calls the LLM provider. FastAPI's TestClient also needs it, so tests share one client.
dependencies = ["fastapi>=0.115", "httpx2>=2", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

# Src layout: packages live in src/, so tests must import the installed package.
[tool.setuptools.packages.find]
where = ["src"]

# Prompt files are not Python code, so they must be listed to be included in a build.
[tool.setuptools.package-data]
"ai_ops.llm" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# Warning policy: a warning fails the run until it is fixed or explicitly filtered here.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

# E/W style, F likely bugs, I import order, UP modern syntax, B bug patterns, D docstrings.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ruff only checks that docstrings exist. Tests are exempt from that check, but the
# code documentation rule in docs/PYTHON_LEARNING_PATH.md still applies to them.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
