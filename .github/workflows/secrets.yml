# Scans the whole Git history for secrets.
# Why: The commit hook is local, and it can be skipped or not installed. This is the second line of
# defence, with an independent scanner. By then a secret has been pushed, so a failure here means
# the key must be revoked, not just removed.
# Used by: GitHub, on every push to main and every pull request.
name: secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret removed in a later commit is still exposed.
          fetch-depth: 0
      - run: python scripts/check_secrets.py
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
