# Runs lint, format check, and tests on Linux and Windows with Python 3.12.
# Why: the project must work on both platforms (FR-09), and a clean runner catches
# anything that only works on one developer's machine.
# Used by: GitHub, on every push to main and every pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Finish both platforms, so a failure shows whether it is OS-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
